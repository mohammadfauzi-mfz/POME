<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POME Monitor</title>
<script src="config.js"></script>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1d2b21;--mut:#6b7a70;--ac:#2e7d4f;--bd:#dfe5df;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1c2520;--tx:#e6efe8;--mut:#92a398;--ac:#4cc07f;--bd:#2d3a33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--ac);color:#fff}
header span{font-size:12px;opacity:.9}
main{padding:12px 12px 84px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:600}
.sm{width:auto;padding:5px 10px;margin:0 0 0 6px;font-size:12px;background:var(--bd);color:var(--tx)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.mut{color:var(--mut);font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.neg{color:var(--bad)}.lock{text-align:center;color:var(--mut);padding:40px 10px}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(0,70%,46%),hsl(60,70%,44%),hsl(125,70%,40%));margin:6px 0 2px}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px;font-size:12px;margin-bottom:10px}
svg{width:100%;height:auto;display:block}svg text{font-size:9px;fill:#fff;font-weight:600;pointer-events:none}
#lg{padding:60px 20px}
header{background:#1b5e20;padding:14px 16px}
.sy{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}
.dt{width:10px;height:10px;border-radius:50%;background:#7cfc9a}.dt.off{background:#ffb74d}
.fs{font-size:17px;font-weight:600;padding:14px;border:2px solid var(--bd);border-radius:14px;background:var(--card)}
.kc{background:var(--card);border-radius:16px;padding:14px;border-left:6px solid;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.kv{font-size:28px;font-weight:800;line-height:1.2;margin:2px 0}.kv small{font-size:14px;font-weight:600;color:var(--mut)}
.ch{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;margin:0 6px 6px 0}
.pc{color:#fff;font-weight:700;padding:4px 10px;border-radius:99px;font-size:13px}
.sh{margin:18px 4px 8px;font-size:18px}
.mc{position:relative;background:#16221a;border-radius:20px;padding:6px;margin:14px 0 10px;height:380px}.mc.fu{height:78vh}
.chips{position:absolute;left:14px;top:14px;z-index:2;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 90px)}
.chip{border:0;border-radius:99px;background:#1b5e20;color:#fff;font-weight:700;padding:8px 13px;font-size:13px;opacity:.55}.chip.on{opacity:1}
.zb{position:absolute;right:14px;top:14px;z-index:2;display:flex;flex-direction:column;gap:8px}
.zb button{width:48px;height:48px;border:0;border-radius:14px;background:#f1f4f1;color:#1d2b21;font-size:22px;font-weight:700}
.lgd{position:absolute;left:14px;bottom:14px;background:#fff;color:#1d2b21;border-radius:14px;padding:8px 12px;font-size:12px;font-weight:600}
#ms{width:100%;height:100%;display:block}
#ms text{fill:#fff;stroke:rgba(0,0,0,.7);paint-order:stroke;font-weight:700}
nav button{display:flex;flex-direction:column;align-items:center;padding:8px 0;font-size:12px}
nav button{line-height:1.2;gap:0}.ic svg{width:24px;height:24px;display:block}nav{padding-bottom:env(safe-area-inset-bottom)}
.ic{display:flex;width:64px;height:32px;align-items:center;justify-content:center;border-radius:16px;margin-bottom:2px}
nav button.on .ic{background:rgba(46,125,79,.2);color:var(--ac)}
.pop{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:var(--card);color:var(--tx);border-radius:16px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.pg{height:8px;background:var(--bd);border-radius:4px;margin:8px 0;overflow:hidden}.pgb{height:100%}
.pv{margin:6px 0;gap:6px}.pv div{font-size:14px;line-height:1.25}
.mc.hs{height:580px}.mc.hs.fu{height:86vh}.mc.hs .lgd{display:none}
#sheet{display:none}#sheet.on{display:block}
#sheet .bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;animation:fi .2s}
#sheet .sh2{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:51;background:var(--card);color:var(--tx);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:su .25s ease-out;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.gr{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 10px}
.qs{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.6}
.qa{display:flex;gap:6px;margin-bottom:4px}.qa .btn{margin:0;width:auto}
.qr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.qr.f{background:rgba(46,125,79,.12);border-radius:8px;padding-left:6px;padding-right:6px}
.qi{display:flex;flex-direction:column;align-items:flex-end}.qi>div{display:flex;gap:4px;align-items:center}.qi input{width:100px;text-align:right}.qi .btn{margin:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b5e20;color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@keyframes su{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}
</style></head><body><div id="app"></div><div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const srv=()=>localStorage.srv||(window.CFG&&CFG.URL)||'';
const J=k=>{try{return JSON.parse(localStorage[k])}catch(e){return null}};
const S={u:J('u'),tab:'dash',rot:'R1',pf:'',z:1,px:0,py:0,lbl:true,full:false,moved:false,goMap:false,mb:null,sel:null,err:'',busy:false,users:[],
 f:{ip:'',ap:'',ab:'',ar:'R1'},d:J('cache')||{pompa:[],blok:[],input:[],alok:[]}};
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const nd=t=>{t=String(t);if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);const d=new Date(t);return isNaN(d)?t:d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const dm=t=>{const p=String(t).slice(0,10).split('-');return p.length==3?p[2]+'/'+p[1]+'/'+p[0]:t};
const NE=m=>{const e=new Error(m);e.net=1;return e};
async function api(a,o){
 if(!srv())throw NE('Alamat server belum diatur');
 const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);let r,j;
 try{r=await fetch(srv(),{method:'POST',body:JSON.stringify(Object.assign({action:a,token:S.u&&S.u.token},o)),signal:c.signal});j=await r.json()}
 catch(x){throw NE('Tidak ada sinyal / server tidak terjangkau')}
 finally{clearTimeout(t)}
 if(!j.ok)throw new Error(j.err||'Gagal');return j}
const R=()=>S.u.role,A=()=>R()=='Admin',P=()=>A()||R()=='PKS',K=()=>A()||R()=='Kebun';
const can={input:P,alok:K,dash:()=>true,atur:()=>true};
const blk=id=>S.d.blok.find(b=>b.id==id);
S.yr=new Date().getFullYear();
const ry=t=>+String(t).slice(0,4)||0,fh=n=>String(Math.round(n*10)/10);
function luasAt(b,k,y){let best=null,bp=-1;const p=y*10+k;
 (S.d.luasH||[]).forEach(h=>{if(h.blok==b.id){const hp=(+h.tahun)*10+(+String(h.rotasi).replace('R',''));if(hp<=p&&hp>bp){bp=hp;best=h}}});
 return best?best.luas:b.luas}
const lu=(b,r,y)=>{y=y||S.yr;return r=='T'?[1,2,3].reduce((a,k)=>a+250*luasAt(b,k,y),0)/750:luasAt(b,+String(r).slice(1),y)};
const got=(b,r,y)=>{y=y||S.yr;return S.d.alok.filter(a=>a.blok==b.id&&ry(a.tgl)==y&&(r=='T'||a.rotasi==r)).reduce((s,a)=>s+a.vol,0)};
const bigLA=(b,r)=>(r=='T'?[1,2,3]:[+String(r).slice(1)]).some(k=>luasAt(b,k,S.yr)>b.luas+0.5);
const pct=(b,r)=>got(b,r)/((r=='T'?750:250)*lu(b,r))*100;
const outst=p=>!hasP(p)?0:S.d.input.filter(i=>i.pompa==p).reduce((s,i)=>s+i.vol,0)-S.d.alok.filter(a=>!a.riwayat&&(blk(a.blok)||{}).pompa==p).reduce((s,a)=>s+a.vol,0);
const col=p=>p>100?'#000':`hsl(${Math.round(Math.max(0,p)*1.25)},70%,${p<50?46:40}%)`;
const hasP=id=>S.d.pompa.some(p=>p.id==id);
const pname=id=>(S.d.pompa.find(p=>p.id==id)||{nama:'Belum ada pompa'}).nama;
const pmatch=pid=>!S.pf||(S.pf=='-'?!hasP(pid):pid==S.pf);
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${v}" ${v==sel?'selected':''}>${l}</option>`).join('');
const pOpts=sel=>opts(S.d.pompa.map(p=>[p.id,p.nama]),sel);
const pOpts0=sel=>opts([['','— Belum ditentukan —']].concat(S.d.pompa.map(p=>[p.id,p.nama])),sel);
const fdate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)?v:today();
const lock=m=>`<div class="lock">🔒<br>${m}</div>`;

/* ===== Mode offline: antrean perubahan di HP, otomatis dikirim saat ada sinyal ===== */
const OB=()=>J('ob')||[];
const setOB=a=>{try{localStorage.ob=JSON.stringify(a)}catch(e){}};
const saveCache=()=>{try{localStorage.cache=JSON.stringify(S.d)}catch(e){}};
const TK={Pompa:'pompa',Blok:'blok',Input:'input',Alokasi:'alok',Luas:'luasH'};
function applyLocal(op){
 if(!S.d.luasH)S.d.luasH=[];
 if(op.type=='batch')return op.items.forEach(it=>applyLocal({type:'save',t:it.t,row:it.row}));
 const k=TK[op.t];if(!k)return;
 if(op.type=='save'){const i=S.d[k].findIndex(x=>x.id==op.row.id);
  if(i>=0)S.d[k][i]=Object.assign({},S.d[k][i],op.row);else S.d[k].push(Object.assign({},op.row))}
 else S.d[k]=S.d[k].filter(x=>x.id!=op.id)}
function enqueue(op){op.qid=uid();applyLocal(op);setOB(OB().concat([op]));saveCache();render();flush()}
let fl=false;
async function flush(){
 if(fl||!S.u)return;
 if(!OB().length)return load();
 fl=true;render();
 try{let q=OB();
  while(q.length){const op=q[0];
   try{op.type=='batch'?await api('batch',{items:op.items}):op.type=='save'?await api('save',{t:op.t,row:op.row}):await api('del',{t:op.t,id:op.id})}
   catch(e){if(e.net||/Sesi/.test(e.message))throw e;S.rej=(S.rej||[]).concat(op.t+': '+e.message)}
   q=OB().filter(x=>x.qid!=op.qid);setOB(q)}
  fl=false;await load()}
 catch(e){S.err=e.message;S.off=!!e.net;if(/Sesi/.test(e.message)){fl=false;return logout()}}
 finally{fl=false;render();if(OB().length&&!S.off)setTimeout(flush,400)}}
async function load(){
 if(OB().length&&!fl)return flush();
 try{const j=await api('all');
  S.d={pompa:j.Pompa,luasH:(j.Luas||[]).map(h=>Object.assign(h,{tahun:+h.tahun,luas:+h.luas})),blok:j.Blok.map(b=>Object.assign(b,{luas:+b.luas})),
   input:j.Input.map(i=>Object.assign(i,{tgl:nd(i.tgl),hm0:+i.hm0,hm1:+i.hm1,vol:+i.vol})),
   alok:j.Alokasi.map(a=>Object.assign(a,{tgl:nd(a.tgl),vol:+a.vol,riwayat:a.riwayat||''}))};
  saveCache();S.err='';S.off=false}
 catch(e){S.err=e.message;S.off=!!e.net;if(/Sesi/.test(e.message)){return logout()}}
 render()}
function save(t,row){
 if(!TK[t])return api('save',{t,row}).then(load).catch(e=>alert(e.message));
 enqueue({type:'save',t,row,by:S.u.username})}
function del(t,id){if(!confirm('Hapus data ini?'))return;
 if(!TK[t])return api('del',{t,id}).then(load).catch(e=>alert(e.message));
 enqueue({type:'del',t,id,by:S.u.username})}
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.u&&OB().length)flush()});
setInterval(()=>{if(S.u&&OB().length)flush()},30000);

/* ===== GPS ===== */
S.gps=null;
const gpsTxt=()=>{const g=S.gps;return !g?'📍 Lokasi belum didapat':g.err?'📍 '+g.err:`📍 ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} (±${Math.round(g.acc)} m)`};
const upGps=()=>{const e=$('#gps');if(e)e.textContent=gpsTxt()};
function getGps(force){return new Promise(res=>{
 if(!navigator.geolocation){S.gps={err:'GPS tidak didukung'};upGps();return res(null)}
 if(!force&&S.gps&&S.gps.t&&Date.now()-S.gps.t<120000)return res(S.gps);
 const e=$('#gps');if(e)e.textContent='📍 Mencari lokasi...';
 navigator.geolocation.getCurrentPosition(p=>{S.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};upGps();res(S.gps)},
  er=>{if(!S.gps||!S.gps.t)S.gps={err:er.code==1?'Izin lokasi ditolak. Aktifkan di pengaturan HP':'Lokasi belum tersedia (sinyal GPS lemah)'};upGps();res(null)},
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000})})}
const gpsF=g=>g&&g.t?{lat:+g.lat.toFixed(6),lng:+g.lng.toFixed(6),akurasi:Math.round(g.acc),waktu:new Date(g.t).toISOString()}:{};
const gpsBox=()=>`<div class="mut" style="margin-top:8px"><span id="gps">${gpsTxt()}</span><button class="btn sm" onclick="getGps(true)">Perbarui</button></div>`;
const gpsLink=r=>r.lat&&r.lng?` · <a href="https://maps.google.com/?q=${r.lat},${r.lng}">📍 Lokasi</a>`:'';
const pend=id=>S.pq&&S.pq.has(id)?' ⏳':'';
async function login(){
 try{const j=await api('login',{username:$('#un').value.trim(),password:$('#pw').value});
  S.u={username:j.username,role:j.role,token:j.token};localStorage.u=JSON.stringify(S.u);S.tab='dash';await load();checkUpd(false)}
 catch(e){alert(e.message)}}
function logout(){S.u=null;localStorage.removeItem('u');render()}
function setSrv(){const v=prompt('URL Web App Apps Script:',srv());if(v!==null){localStorage.srv=v.trim();render()}}
async function go(t){S.tab=t;if(t=='input'||t=='alok')getGps();if(t=='atur'&&!S.upd)checkUpd(false);if(t=='atur'&&A()){try{S.users=(await api('users')).users}catch(e){}}render()}

function vLogin(){return `<div id="lg"><h2 style="text-align:center;color:var(--ac)">💧 POME Monitor</h2><div class="c">
<label>Username</label><input id="un" autocapitalize="none"><label>Password</label><input id="pw" type="password">
<button class="btn" onclick="login()">Masuk</button></div>
<div class="mut" style="text-align:center">${srv()?'':'⚠️ Server belum diatur. '}<a href="#" onclick="setSrv();return false">Atur server</a></div><div class="mut" style="text-align:center;margin-top:18px">Create By Mohammad Fauzi · Versi ${AV().v}</div></div>`}

function vInput(){
 if(!can.input())return lock('Menu ini khusus tim PKS dan Admin');
 const f=S.f;if(!S.d.pompa.find(p=>p.id==f.ip))f.ip=(S.d.pompa[0]||{}).id;
 return `<div class="c"><h3>Input pengaliran</h3><div class="r2"><div><label>Pompa</label><select onchange="S.f.ip=this.value">${pOpts(f.ip)}</select></div><div><label>Tanggal alir</label><input id="tg" type="date" value="${S.f.tg||today()}" onchange="S.f.tg=this.value"></div></div>
 <div class="r2"><div><label>HM awal</label><input id="h0" type="number" inputmode="decimal"></div><div><label>HM akhir</label><input id="h1" type="number" inputmode="decimal"></div></div>
 <label>Volume dialihkan (m³)</label><input id="vl" type="number" inputmode="decimal">${gpsBox()}<button class="btn" onclick="addIn()">Simpan</button></div>
 <div class="c"><h3>Outstanding per pompa</h3>${S.d.pompa.map(p=>`<div class="row"><span>${p.nama}</span><b class="${outst(p.id)<0?'neg':''}">${fmt(outst(p.id))} m³</b></div>`).join('')}</div>
 <div class="c"><h3>Riwayat input</h3>${S.d.input.slice().reverse().sort((a,b)=>String(b.tgl).localeCompare(String(a.tgl))).slice(0,40).map(i=>`<div class="row"><span>${dm(i.tgl)} · ${pname(i.pompa)}${pend(i.id)}<br><span class="mut">HM ${i.hm0} → ${i.hm1} (${(i.hm1-i.hm0).toFixed(1)} jam) · ${i.oleh}${gpsLink(i)}</span></span><span><b>${fmt(i.vol)}</b> m³<button class="btn sm" onclick="editIn('${i.id}')">Edit</button><button class="btn sm" onclick="del('Input','${i.id}')">✕</button></span></div>`).join('')||'<div class="mut">Belum ada data</div>'}</div>`}
async function addIn(){const v=+$('#vl').value,h0=+$('#h0').value,h1=+$('#h1').value,tg=fdate($('#tg').value);if(!v||!S.f.ip)return alert('Isi pompa dan volume');
 if(S.sv)return;S.sv=1;try{const g=await getGps();save('Input',Object.assign({id:uid(),tgl:tg,pompa:S.f.ip,hm0:h0,hm1:h1,vol:v,oleh:S.u.username},gpsF(g)))}finally{S.sv=0}}
function editIn(id){const i=S.d.input.find(x=>x.id==id),v=prompt('Koreksi volume (m³):',i.vol);
 if(v===null||isNaN(+v))return;const h0=prompt('HM awal:',i.hm0),h1=prompt('HM akhir:',i.hm1),t=prompt('Tanggal alir (YYYY-MM-DD):',i.tgl);
 save('Input',Object.assign({},i,{vol:+v,hm0:+h0,hm1:+h1,tgl:fdate(t)}))}

function vAlok(){
 if(!can.alok())return lock('Menu ini khusus tim Kebun dan Admin');
 const f=S.f;if(f.ap===undefined||(f.ap!==''&&!hasP(f.ap)))f.ap=(S.d.pompa[0]||{}).id||'';
 const bl=S.d.blok.filter(b=>f.ap===''?!hasP(b.pompa):b.pompa==f.ap);if(!bl.find(b=>b.id==f.ab))f.ab=bl[0]?bl[0].id:'';
 return `<div class="c"><h3>Alokasi ke blok</h3><label>Jalur pompa</label><select onchange="S.f.ap=this.value;render()">${pOpts0(f.ap)}</select>
 <div class="mut" style="margin-top:6px">${f.ap===''?'Blok tanpa pompa: tidak memakai saldo outstanding':`Outstanding: <b class="${outst(f.ap)<0?'neg':''}">${fmt(outst(f.ap))} m³</b>`}</div>
 <div class="r2"><div><label>Blok</label><select onchange="S.f.ab=this.value">${opts(bl.map(b=>[b.id,b.id+' ('+fh(lu(b,f.ar||'R1'))+' ha)']),f.ab)}</select></div>
 <div><label>Rotasi</label><select onchange="S.f.ar=this.value">${opts([['R1','R1'],['R2','R2'],['R3','R3']],f.ar)}</select></div></div>

 return {bl,inp:D.input.filter(i=>pmatch(i.pompa)),al:D.alok.filter(a=>ids.has(a.blok))}}
function shareFile(name,u8){
 if(window.Android&&Android.shareFile)Android.shareFile(name,b64(u8),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8]));a.download=name;a.click()}}
function shareExcel(){
 const {bl,inp,al}=rekapData(),R4=['R1','R2','R3','T'];
 const h1=['Blok','Pompa','Luas R1 (ha)','Luas R2 (ha)','Luas R3 (ha)'];R4.forEach(k=>{const n=k=='T'?'Tahun':k;h1.push(n+' (m³)',n+' (m³/ha)',n+' (%)')});
 const s1=[h1].concat(bl.map(b=>{const r=[b.id,pname(b.pompa),lu(b,'R1'),lu(b,'R2'),lu(b,'R3')];R4.forEach(k=>r.push(r0(got(b,k)),r0(got(b,k)/lu(b,k)),r1(pct(b,k))));return r}));
 const s2=[['Tanggal','Pompa','HM awal','HM akhir','Jam','Volume (m³)','Oleh','Latitude','Longitude','Akurasi (m)','Waktu']].concat(inp.map(i=>[i.tgl,pname(i.pompa),i.hm0,i.hm1,r1(i.hm1-i.hm0),i.vol,i.oleh||'',+i.lat||'',+i.lng||'',+i.akurasi||'',i.waktu||'']));
 const s3=[['Tanggal','Blok','Rotasi','Volume (m³)','m³/ha','Oleh','Latitude','Longitude','Akurasi (m)','Waktu','Jenis']].concat(al.map(a=>[a.tgl,a.blok,a.rotasi,a.vol,blk(a.blok)?r0(a.vol/luasAt(blk(a.blok),+String(a.rotasi).slice(1)||1,ry(a.tgl)||S.yr)):'',a.oleh||'',+a.lat||'',+a.lng||'',+a.akurasi||'',a.waktu||'',a.riwayat?'Riwayat':'Alokasi']));
 shareFile('POME-Rekap-'+today()+'.xlsx',buildXlsx([['Rekap Blok '+S.yr,s1],['Input PKS',s2],['Alokasi',s3],['Riwayat Luas',[['Blok','Tahun','Rotasi mulai','Luas (ha)']].concat((S.d.luasH||[]).map(h=>[h.blok,h.tahun,h.rotasi,h.luas]))]]))}
function textRekap(){
 const r=S.rot,pf=S.pf,{bl,inp,al}=rekapData(),ps=S.d.pompa.filter(p=>pmatch(p.id)),sum=a=>a.reduce((s,x)=>s+x.vol,0);
 const alr=al.filter(a=>r=='T'||a.rotasi==r),d=today().split('-').reverse().join('/');
 let t=`*REKAP POME* · ${d}\n${rl(r)} ${S.yr} · ${pf=='-'?'Tanpa pompa':pf?pname(pf):'Semua pompa'}\n\nMasuk dari PKS: *${fmt(sum(inp))} m³*\nSudah dialokasi: *${fmt(sum(alr))} m³*\nOutstanding: *${fmt(sum(inp)-sum(al.filter(a=>!a.riwayat)))} m³*\n`;
 ps.forEach(p=>{const pb=bl.filter(b=>b.pompa==p.id).sort((a,b)=>pct(a,r)-pct(b,r));
  t+=`\n*${p.nama}* · outstanding ${fmt(outst(p.id))} m³\n`+(pb.map(b=>`• ${b.id} (${fh(lu(b,r))} ha): ${r0(pct(b,r))}%${pct(b,r)>100?' ⚠️ over':pct(b,r)>=100?' ✅':''}`).join('\n')||'• belum ada blok')+'\n'});
 return t.trim()}

function defRot(p){if(S.rot!='T')return S.rot;const bl=S.d.blok.filter(b=>b.pompa==p);for(const r of['R1','R2','R3'])if(bl.some(b=>pct(b,r)<100))return r;return 'R1'}
function openAlok(id,pid){
 if(!K())return;const b=id?blk(id):null;
 const pp=b?b.pompa:pid=='-'?'':(pid||(S.pf=='-'?'':S.pf)||(S.d.pompa[0]||{}).id||'');Q.p=hasP(pp)?pp:'';Q.d=today();Q.r=defRot(Q.p);Q.v={};Q.focus=b?b.id:null;

 <div>${bl.map((b,i)=>{const sv=Math.ceil(sisa(b,Q.r));return `<div class="qr${Q.focus==b.id?' f':''}"><span><b>${b.id}</b> · ${fh(lu(b,Q.r))} ha<br><span class="mut">${Math.round(pct(b,Q.r))}% · sisa ${fmt(sv)} m³</span></span>
  <span class="qi"><div><button class="btn sm" onclick="qSet(${i},${sv})">Sisa</button><input id="q_${i}" type="number" inputmode="decimal" placeholder="0" value="${Q.v[b.id]||''}" oninput="qIn(${i},this.value)"></div><span class="mut" id="qw_${i}"></span></span></div>`}).join('')||'<div class="mut" style="padding:10px 0">Pompa ini belum punya blok</div>'}</div>
 ${gpsBox()}<button class="btn" id="qb" onclick="qSave()">Alokasikan</button></div>`;
 qUpd();if(Q.focus){const i=bl.findIndex(b=>b.id==Q.focus),e=$('#q_'+i);if(e)setTimeout(()=>e.scrollIntoView({block:'center'}),50)}}
function qUpd(){
 const bl=qBlocks(),o=outst(Q.p);let tot=0,n=0;
 bl.forEach((b,i)=>{const v=+Q.v[b.id]||0;if(v>0){tot+=v;n++}const w=$('#qw_'+i);
  if(w){const pp=(got(b,Q.r)+v)/(250*lu(b,Q.r))*100;w.innerHTML=v>0?'→ '+Math.round(pp)+'%'+(pp>100?' <b class="neg">⚠️ over</b>':''):''}});
 const left=o-tot,q=$('#qs'),qb=$('#qb');
 if(q)q.innerHTML=Q.p===''?`Blok tanpa pompa · tidak memakai saldo outstanding<br>Akan dialokasikan: <b>${fmt(tot)} m³</b>`:`Outstanding ${pname(Q.p)}: <b class="${o<0?'neg':''}">${fmt(o)} m³</b><br>Akan dialokasikan: <b>${fmt(tot)} m³</b> · ${left>=0?'sisa':'<span class="neg">kurang</span>'} <b class="${left<0?'neg':''}">${fmt(Math.abs(left))} m³</b>`;
 if(qb)qb.textContent=n?`Alokasikan ${n} blok · ${fmt(tot)} m³`:'Alokasikan'}
function qIn(i,v){const b=qBlocks()[i];if(b){Q.v[b.id]=v===''?0:+v;qUpd()}}
function qSet(i,v){const b=qBlocks()[i];if(!b)return;Q.v[b.id]=v;const e=$('#q_'+i);if(e)e.value=v||'';qUpd()}
function qClear(){Q.v={};Q.focus=null;qDraw()}
function qAuto(){let left=Math.max(0,outst(Q.p));Q.v={};Q.focus=null;
 qBlocks().sort((a,b)=>pct(a,Q.r)-pct(b,Q.r)).forEach(b=>{const v=Math.floor(Math.min(left,sisa(b,Q.r)));if(v>0){Q.v[b.id]=v;left-=v}});
 if(!Object.keys(Q.v).length)toast(Q.p===''?'Pilih pompa dulu untuk isi otomatis':'Tidak ada outstanding atau semua blok sudah tuntas');qDraw()}
async function qSave(){
 const items=qBlocks().map(b=>[b,+Q.v[b.id]||0]).filter(x=>x[1]>0);
 if(!items.length)return alert('Isi volume minimal untuk satu blok');
 const tot=items.reduce((a,x)=>a+x[1],0),o=outst(Q.p);
 if(Q.p!==''&&tot>o+0.5&&!confirm('Total '+fmt(tot)+' m³ melebihi outstanding '+fmt(o)+' m³. Tetap simpan?'))return;
 if(S.sv)return;S.sv=1;const qb=$('#qb');if(qb)qb.textContent='Menyimpan...';
 try{const g=await getGps(),r=Q.r,tq=fdate($('#qd')?$('#qd').value:Q.d);
  items.forEach(([b,v])=>save('Alokasi',Object.assign({id:uid(),tgl:tq,blok:b.id,rotasi:r,vol:v,oleh:S.u.username},gpsF(g))));
  qClose();toast('✓ '+items.length+' alokasi disimpan')}finally{S.sv=0}}

 try{if(!REPO())throw new Error('Repo GitHub belum diatur');
  const r=await fetch('https://api.github.com/repos/'+REPO()+'/releases/tags/latest');
  if(!r.ok)throw new Error(r.status==404?'Rilis belum ada atau repo bersifat privat':'GitHub error '+r.status);
  const j=await r.json(),m=/build\s*(\d+)/i.exec((j.name||'')+' '+(j.body||'')),nb=m?+m[1]:0,as=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
  if(!as)throw new Error('File APK tidak ditemukan di rilis');

/* ===== Impor CSV: blok (luas, pompa) + riwayat alokasi per rotasi ===== */
function parseCSV(t){
 const l0=t.split('\n')[0],d=l0.split(';').length>l0.split(',').length?';':',',rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x!==''))rows.push(r);return {rows,d}}
function impCsv(el){const f=el.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{
  const {rows,d}=parseCSV(String(rd.result).replace(/^﻿/,'')),h=rows.shift().map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
  if(ix('blok')<0)throw new Error('Kolom "blok" tidak ditemukan di baris pertama');
  const num=v=>{v=String(v==null?'':v).trim();if(d==';')v=v.replace(',','.');return v===''?NaN:+v};
  const DT={1:'2026-04-30',2:'2026-08-31',3:'2026-10-31'},bl=[],al=[],miss=[];let nb=0,ul=0,np=0,nl=0;const lh=[];
  rows.forEach(r=>{const id=(r[ix('blok')]||'').trim();if(!id)return;const ex=blk(id);let l=num(r[ix('luas')]);
   if(isNaN(l)||l<=0){if(ex)l=ex.luas;else return miss.push(id)}
   let pid=ex&&hasP(ex.pompa)?ex.pompa:'';
   if(ix('pompa')>=0){const nm=(r[ix('pompa')]||'').trim().toLowerCase();if(nm){const pp=S.d.pompa.find(p=>p.nama.toLowerCase()==nm||p.id==nm);if(pp)pid=pp.id;else np++}}
   if(!ex)nb++;else if(ex.luas!=l)ul++;
   bl.push({t:'Blok',row:{id,luas:l,pompa:pid}});
   const lb=num(r[ix('luas_baru')]),mm=/(\d{4})\D*R?([1-3])/i.exec((r[ix('mulai')]||'')+'');
   if(lb>0&&mm){nl++;lh.push({t:'Luas',row:{id:id+'-'+mm[1]+'-R'+mm[2],blok:id,tahun:+mm[1],rotasi:'R'+mm[2],luas:lb}})}
   [1,2,3].forEach(k=>{const v=num(r[ix('r'+k)]);if(v>0){const t=(r[ix('tgl'+k)]||'').trim();
    al.push({t:'Alokasi',row:{id:'rw-'+id+'-R'+k,tgl:/^\d{4}-\d{2}-\d{2}$/.test(t)?t:DT[k],blok:id,rotasi:'R'+k,vol:Math.round(v*10)/10,oleh:'riwayat',riwayat:'1'}})}})});
  if(!bl.length)throw new Error('Tidak ada baris yang bisa dibaca');
  const tv=al.reduce((a,x)=>a+x.row.vol,0);
  if(!confirm('Impor '+bl.length+' blok ('+nb+' baru, '+ul+' luas diperbarui) dan '+al.length+' riwayat alokasi (total '+fmt(tv)+' m³)'+(nl?' dan '+nl+' perubahan luas per periode':'')+'?'+(np?'\n'+np+' nama pompa tidak dikenali dan dibiarkan kosong.':'')+(miss.length?'\nDilewati (luas kosong): '+miss.join(', '):'')+'\n\nRiwayat tidak dihitung ke saldo outstanding pompa.'))return;
  const all=bl.concat(al,lh);for(let i=0;i<all.length;i+=30)enqueue({type:'batch',items:all.slice(i,i+30),by:S.u.username});
  toast('✓ Impor '+bl.length+' blok dan '+al.length+' riwayat')}
  catch(e){alert('Impor gagal: '+e.message)}el.value=''};rd.readAsText(f)}

function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const g=JSON.parse(r.result);if(!g.features||!g.features.length)throw 0;
  const keys=Object.keys(g.features[0].properties||{}),ids=S.d.blok.map(b=>b.id);let best=keys[0],bn=-1;
  keys.forEach(k=>{const n=g.features.filter(x=>ids.includes(String(x.properties[k]))).length;if(n>bn){bn=n;best=k}});
  localStorage.geo=JSON.stringify(g);localStorage.gk=best;render();
  setTimeout(()=>{const e=$('#gi');if(e)e.textContent='Terbaca '+g.features.length+' poligon, '+bn+' cocok dengan blok (kolom: '+best+').'},0)}
  catch(e){alert('File GeoJSON tidak valid')}};r.readAsText(f)}
