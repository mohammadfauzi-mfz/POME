plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def bn = (findProperty('buildNum') ?: '1').toString().toInteger()
android {
    namespace 'com.bimapalma.pome'
    compileSdk 34
    defaultConfig { applicationId 'com.bimapalma.pome'; minSdk 24; targetSdk 34; versionCode bn; versionName '1.0' }
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
